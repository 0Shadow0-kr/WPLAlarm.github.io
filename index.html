        .controls {

        }
        .result-box {

        .tourney-details {

            color: #7f8c8d;
            margin-top: 5px;
        }
        .highlight {
            color: #e67e22;
            font-weight: bold;
        }

                t.maxRegTime = t.maxRegTime.split(' ')[1];
            }
        });

        function timeToSeconds(timeStr) {
            let parts = timeStr.split(':');
            return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
        }

        // 초 단위의 남은 시간을 "시:분:초" (1시간 미만이면 "분:초")로 포맷팅
        function formatCountdown(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = Math.floor(totalSeconds % 60);

            if (h > 0) {
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function formatResultHTML(tourney) {
            if (!tourney) return `<div class="tourney-name">조건에 맞는 토너먼트가 없습니다.</div>`;
            
            // 실시간 카운트다운 생성
            const countdownStr = formatCountdown(tourney.diff);

            return `
                <div class="tourney-name">
                    ${tourney.name} 
                    <span class="countdown">${countdownStr}</span>
                </div>
                <div class="tourney-details">
                    맥스레잇 레지: <span class="highlight">${tourney.maxRegTime}</span> 
                    (바이인: ${tourney.buyin.toLocaleString()})
                </div>
            `;
        }

        function updateClockAndTournaments() {
            const now = new Date();
            
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const currentStr = `${h}:${m}:${s}`;
            
            document.getElementById('clock').innerText = currentStr;

            const nowSec = timeToSeconds(currentStr);
            const minB = Number(document.getElementById('minBuyin').value) || 0;
            const maxB = Number(document.getElementById('maxBuyin').value) || Infinity;

            let filtered = tourneyData.filter(t => t.buyin >= minB && t.buyin <= maxB);
            
            filtered.forEach(t => {
                let tSec = timeToSeconds(t.maxRegTime);
                let diff = tSec - nowSec;
                
                if (diff < 0) {
                    diff += 86400; 
                }
                t.diff = diff;
            });

            filtered.sort((a, b) => a.diff - b.diff);

            document.getElementById('closest-tourney').innerHTML = formatResultHTML(filtered[0] || null);
            document.getElementById('next-tourney').innerHTML = formatResultHTML(filtered[1] || null);
        }
        
        setInterval(updateClockAndTournaments, 1000);
        
        document.getElementById('minBuyin').addEventListener('input', updateClockAndTournaments);
        document.getElementById('maxBuyin').addEventListener('input', updateClockAndTournaments);
        
        updateClockAndTournaments();
    </script>
